[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-bert"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "pyyaml", "tqdm", "matplotlib", "tensorboard", "tokenizers", "datasets"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
