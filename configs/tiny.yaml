# Debug / unit-test / CPU config
model:
  vocab_size: 8000
  hidden_size: 192
  num_hidden_layers: 4
  num_attention_heads: 4
  intermediate_size: 768
  max_position_embeddings: 128
data: {dataset: wikitext-2, max_seq_length: 128}
training:
  batch_size: 16
  gradient_accumulation_steps: 2
  max_steps: 2000
  learning_rate: 5.0e-4
  min_learning_rate: 5.0e-5
  warmup_steps: 100
  eval_every: 200
  save_every: 200
  experiment_name: tiny
