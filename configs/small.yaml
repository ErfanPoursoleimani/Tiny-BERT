# Default: ~29M params (incl. tied output head), RTX 3050 6GB target
model:
  vocab_size: 30000
  hidden_size: 384
  num_hidden_layers: 6
  num_attention_heads: 6
  intermediate_size: 1536
  max_position_embeddings: 256
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  layer_norm_eps: 1.0e-12
  hidden_act: gelu
  type_vocab_size: 2
  tie_embeddings: true
  attention_implementation: auto
mlm: {probability: 0.15, mask_probability: 0.80, random_probability: 0.10, unchanged_probability: 0.10}
nsp: {enabled: false, weight: 1.0}
data: {dataset: wikitext-2, max_seq_length: 256}
training:
  batch_size: 4
  gradient_accumulation_steps: 8
  max_steps: 10000
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 500
  weight_decay: 0.01
  gradient_clip: 1.0
  eval_every: 500
  save_every: 500
  experiment_name: small
